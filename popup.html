<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yTunes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="on-ytm" hidden>
      <h1>yTunes</h1>
      <div class="artwork" hidden>
        <img id="artwork" alt="" />
      </div>
      <p id="now-playing">Looking for the player…</p>
      <p id="host-status" class="status"></p>
      <div class="transport" role="group" aria-label="Playback">
        <button type="button" data-action="previous">Previous</button>
        <button type="button" id="play-pause" data-action="playPause">
          Play/Pause
        </button>
        <button type="button" data-action="next">Next</button>
      </div>
      <button type="button" id="show-original" class="linkish">
        Show original YouTube Music
      </button>
    </main>
    <main id="off-ytm" hidden>
      <h1>yTunes</h1>
      <p>This only works on YouTube Music.</p>
      <a href="https://music.youtube.com" target="_blank" rel="noreferrer">
        Open YouTube Music
      </a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
