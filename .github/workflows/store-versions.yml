name: Refresh store versions

on:
  schedule:
    - cron: "01 */6 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: store-versions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Chrome, Firefox, and GitHub versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node fetch-store-versions.js

      - name: Commit if the snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/versions.json
          if git diff --staged --quiet; then
            echo "No version changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: refresh store versions

          EOF
          )"
          git push
